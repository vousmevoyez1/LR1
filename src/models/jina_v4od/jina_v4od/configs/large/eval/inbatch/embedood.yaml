data_config:
  cand_pool_dir_name: cand_pool/local
  enable_query_instruct: true
  image_size: 224, 224
  query_instruct_path: instructions/query_instructions.tsv
  shuffle_cand: true
  test_dir_name: query/test
  train_dir_name: query/train
  val_dir_name: query/val
dataloader_config:
  batch_size: 32
  num_workers: 2
dist_config:
  dist_url: env://
embed_config:
  cand_pools_config:
    cand_pools_name_to_embed:
    - edis_task2
    - nights_task4
    - fashioniq_task7
    - cirr_task7
    embed_union_pool: true
    enable_embed: true
  embed_dir_name: embed
  test_datasets_config:
    correspond_cand_pools_name:
    - edis_task2
    - nights_task4
    - fashioniq_task7
    - cirr_task7
    datasets_name:
    - edis_task2
    - nights_task4
    - fashioniq_task7
    - cirr_task7
    enable_embed: true
  train_datasets_config:
    correspond_cand_pools_name: null
    datasets_name: null
    enable_embed: false
  use_fp16: true
  val_datasets_config:
    correspond_cand_pools_name: null
    datasets_name: null
    enable_embed: false
experiment:
  description: ${model.name} ${model.size} ${experiment.instruct_status} ${experiment.exp_name}
  exp_name: InBatch
  instruct_status: Instruct
  path_suffix: ${model.short_name}/${model.size}/${experiment.instruct_status}/${experiment.exp_name}/
model:
  ckpt_config:
    ckpt_dir: checkpoint/${experiment.path_suffix}
    ckpt_name: xxx.pth
  mbeir_max_text_length: 512
  mbeir_task_label: retrieval
  symmetric_query_candidate_encoding: false  # true=Query/Candidate 对称编码（都加 thought token）
  thought_token_pooling_mode: last  # final embedding模式: last | mean_all_thought_tokens
  mbeir_num_thought_tokens: 8       # K: Number of thought tokens for evaluation (0=disabled)
  name: JinaEmbeddingsV4oModel      # Use V4o model with thought tokens
  original_model_name: /data/jina-v4-local-copy
  short_name: JinaV4
  size: Large
seed: 2026
