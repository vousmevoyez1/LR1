    correspond_cand_pools_name:
    - mscoco_task0_test
    - mscoco_task3_test
    - UNION
    - UNION
    correspond_metrics_name:
    - Recall@1, Recall@5, Recall@10
    - Recall@1, Recall@5, Recall@10
    - Recall@1, Recall@5, Recall@10
    - Recall@1, Recall@5, Recall@10
    correspond_qrels_name:
    - mscoco_task0
    - mscoco_task3
    - mscoco_task0
    - mscoco_task3
    datasets_name:
    - mscoco_task0
    - mscoco_task3
    - mscoco_task0
    - mscoco_task3
    enable_retrieve: true
  train_datasets_config:
    correspond_cand_pools_name: null
    datasets_name: null
    enable_retrieve: false
  val_datasets_config:
    correspond_cand_pools_name: null
    correspond_qrels_name: null
    datasets_name: null
    enable_retrieve: false
  write_to_tsv: true
